[project]
name = "anilog"
version = "0.2.1"
description = "A Flet desktop app for tracking watched anime."
readme = "README.md"
requires-python = ">=3.10"
license = "GPL-3.0-or-later"
license-files = ["LICENSE"]
dependencies = [
    "flet==1.0.5",
    "openpyxl==3.1.5",
    "pillow>=12.3,<14",
    "pykakasi==2.3.0",
    "pypinyin==0.55.0",
    "requests==2.34.2",
    "xlrd==2.0.2",
]

[tool.flet]
org = "com.damage"
product = "AniLog"
